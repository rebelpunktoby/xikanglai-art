<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found · Xikang Lai</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232B284F'/%3E%3Cpath d='M10 25V9h12v16' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E">
<meta name="theme-color" content="#2B284F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Noto+Sans+TC:wght@300;400&display=swap">
<style>
:root{--paper:#FAFAFB;--ink:#17161F;--mute:#6C6B7B;--line:#DEDDE6;--navy:#2B284F;
  --f-display:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--gut:clamp(16px,4vw,56px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F0E16;--ink:#ECEBF3;--mute:#9897AA;--line:#2A2938}}
:root[data-theme="dark"]{--paper:#0F0E16;--ink:#ECEBF3;--mute:#9897AA;--line:#2A2938}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f-display);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr;padding:0 var(--gut)}
[lang="zh-Hant"]{font-family:var(--f-zh)}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
header{min-height:64px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.brand{font-size:12px;letter-spacing:.28em;text-transform:uppercase}
.brand span{font:300 12px/1 var(--f-zh);letter-spacing:.32em;margin-left:12px}
main{display:grid;align-content:center;justify-items:start;gap:28px;max-width:1200px;width:100%;margin-inline:auto;padding-block:64px}
.gate{width:56px;height:72px;border:1px solid var(--ink);border-bottom:0}
h1{margin:0;display:grid;gap:.6em}
h1 .en{font:200 clamp(34px,6vw,72px)/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
h1 .zh{font:300 clamp(14px,1.6vw,19px)/1 var(--f-zh);letter-spacing:.5em;color:var(--mute)}
p{margin:0;color:var(--mute);font-size:14px}
p [lang]{display:block;letter-spacing:.06em}
.home{font-size:11px;letter-spacing:.24em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:4px;transition:border-color .4s}
.home:hover{border-color:var(--ink)}
.home [lang]{letter-spacing:.3em;margin-left:10px}
</style>
</head>
<body>
<header><a class="brand" href="/">Xikang Lai<span lang="zh-Hant">賴錫康</span></a></header>
<main>
  <div class="gate" aria-hidden="true"></div>
  <h1><span class="en">Not found</span><span class="zh" lang="zh-Hant">找不到此頁</span></h1>
  <p>This page does not exist or has moved.<span lang="zh-Hant">此頁面不存在或已移動。</span></p>
  <a class="home" href="/">Return to the exhibition<span lang="zh-Hant">返回展覽</span></a>
</main>
</body>
</html>
